name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: The tag must match package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: node scripts/build-single.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koble-${{ matrix.os }}
          path: dist/koble-*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance: a signed statement, in GitHub's attestation store, that these files were built here from this tag.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: The skills as a plugin to upload (koble.plugin)
        run: node scripts/build-plugin.mjs && cp dist/koble.plugin out/
      - name: Checksums
        run: cd out && sha256sum koble-* koble.plugin > checksums.txt && cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/koble-*
            out/koble.plugin
            out/checksums.txt
            scripts/install.sh
            scripts/install.ps1
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "koble $GITHUB_REF_NAME" --generate-notes \
            out/koble-* out/koble.plugin out/checksums.txt scripts/install.sh scripts/install.ps1
