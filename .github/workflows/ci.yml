name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build the single-file koble
        run: node scripts/build-single.mjs
      - name: Credential Manager round trip
        if: runner.os == 'Windows'
        run: node scripts/credential-selftest.mjs
      - name: koble uninstall removes itself on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'koble-uninstall'
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item dist\koble-windows-x64.exe "$d\koble.exe"
          $env:KOBLE_CONFIG_DIR = "$d\settings"; $env:KOBLE_CREDENTIAL_STORE = 'file'
          New-Item -ItemType Directory -Force $env:KOBLE_CONFIG_DIR | Out-Null
          Set-Content "$env:KOBLE_CONFIG_DIR\config.json" '{"serial":"000000000000000","username":"ci"}'
          & "$d\koble.exe" uninstall --yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall exited $LASTEXITCODE" }
          Start-Sleep -Seconds 8
          if (Test-Path "$d\koble.exe") { throw 'koble.exe was not removed' }
          if (Test-Path $env:KOBLE_CONFIG_DIR) { throw 'the settings folder was not removed' }
          'koble uninstall removed itself and its settings'
      - name: install.ps1 parses in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors; exit 1 }
      - name: install.ps1 installs for an account with no user Path
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Environment]::SetEnvironmentVariable('Path', $null, 'User')
          $env:KOBLE_VERSION = gh release list --repo $env:GITHUB_REPOSITORY --limit 1 --json tagName --jq '.[0].tagName'
          $env:KOBLE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'koble-install'
          $env:KOBLE_SKIP_SETUP = '1'
          & .\scripts\install.ps1
          $p = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($p -ne $env:KOBLE_INSTALL_DIR) { throw "the user Path is '$p'" }
          & "$env:KOBLE_INSTALL_DIR\koble.exe" version
      - name: install.sh passes shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh
      - name: The installers are plain ASCII (macOS bash 3.2 reads "$var…" as a longer variable name in a UTF-8 terminal; PowerShell 5.1 misreads UTF-8 without a BOM)
        if: runner.os == 'Linux'
        run: "test -f scripts/install.sh && test -f scripts/install.ps1 && ! LC_ALL=C grep -n '[^ -~\t]' scripts/install.sh scripts/install.ps1"
